# Build the static site and publish it to GitHub Pages.
#
# Two channels from one repo, one Pages site:
#   main  → the stable site, served at www.wardwise.org   (Pages root)
#   dev   → the preview channel, served at dev.wardwise.org   (Pages /dev/, CloudFront origin path)
# Merging to `dev` IS the preview deploy; a PR from dev → main (maintainer review) promotes it.
# Both builds go out together on every push to either branch, so neither can be stale.
#
# www.wardwise.org / dev.wardwise.org are CloudFront distributions the maintainer owns; they
# also route /api/*, /login, /admin/*, /survey… to the private API. There are no cloud credentials
# in this repo and none are needed — if a step here ever asks for an AWS secret, that's the wrong
# design, not a missing setting.
name: pages

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
        continue-on-error: true   # if the dev branch is ever missing, the preview channel = main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r "$( [ -f main/requirements.txt ] && echo main || echo dev )/requirements.txt"
      - name: Build the stable site (main)
        env:
          GA_ID: ${{ vars.GA_ID }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
        run: (cd main && python scripts/build_static.py --out ../dist && python scripts/check_build.py ../dist)
      - name: Build the preview channel (dev)
        # no analytics on the preview channel: it is for the people building it
        run: |
          if [ -f dev/scripts/build_static.py ]; then
            (cd dev && python scripts/build_static.py --out ../dist/dev && python scripts/check_build.py ../dist/dev)
            rm -f dist/dev/CNAME
          else
            echo "no dev branch; preview channel mirrors main"
          fi
      - name: Build this PR's branch (so the check runs on what's being proposed)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          path: pr
      - if: github.event_name == 'pull_request'
        working-directory: pr
        run: python scripts/build_static.py --out ../dist-pr && python scripts/check_build.py ../dist-pr
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
